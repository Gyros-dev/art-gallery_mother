# Настройка панели управления сайтом (Pages CMS).
# Открывается на app.pagescms.org — вход через GitHub, приглашение по email.

media:
  - name: gobelen
    label: Картинки — Гобелен
    input: images/art/Гобелен
    output: /images/art/Гобелен
    categories: [image]
  - name: collage
    label: Картинки — Коллаж
    input: images/art/Коллаж
    output: /images/art/Коллаж
    categories: [image]
  - name: object
    label: Картинки — Арт-объект
    input: images/art/Арт-объект
    output: /images/art/Арт-объект
    categories: [image]
  - name: exhibition_photos
    label: Фотографии с выставок
    input: images/exhibitions
    output: /images/exhibitions
    categories: [image]

content:
  # ---------- Выставки ----------
  - name: exhibitions
    label: Выставки
    type: file
    path: data/exhibitions.json
    format: json
    list: true
    icon: calendar
    fields:
      - name: title
        label: Название выставки
        type: string
        required: true
      - name: date
        label: Даты
        type: string
        required: true
        description: "Как в афише: «07 августа — 18 октября 2026» или просто «2024». Сайт сам определит, прошла выставка, идёт сейчас или только будет."
      - name: location
        label: Место
        type: string
        description: "Зал, улица, город"
      - name: description
        label: Описание
        type: text
        description: "Необязательно. Короткое пояснение или «Совместно с И. Дьяковым»."
      - name: url
        label: Сайт выставки
        type: string
        pattern:
          regex: "^(https://.*)?$"
          message: "Ссылка должна начинаться с https:// либо остаться пустой"
      - name: photos
        label: Папка с фотографиями
        type: string
        description: "Название папки внутри «Фотографии с выставок». Оставьте пустым, если фото нет."

  # ---------- Настройки сайта ----------
  - name: settings
    label: Настройки сайта
    type: file
    path: data/site.json
    format: json
    icon: settings
    fields:
      - name: title
        label: Название сайта
        type: string
        required: true
        description: "Видно во вкладке браузера и при отправке ссылки в мессенджер"
      - name: shortTitle
        label: Короткое имя
        type: string
      - name: tagline
        label: Подзаголовок
        type: string
      - name: description
        label: Описание для поисковиков
        type: text
        description: "Две-три строки. Показывается в Яндексе и Google под названием сайта."
      - name: url
        label: Адрес сайта
        type: string
        description: "Когда купите домен — впишите сюда, например https://annaveksler.ru. Всё остальное подстроится само."
      - name: name
        label: Имя художника
        type: string
      - name: location
        label: Город
        type: string
      - name: email
        label: Электронная почта
        type: string
        description: "Оставьте пустым — контакт не будет показан на сайте"
      - name: phone
        label: Телефон
        type: string
        description: "Оставьте пустым — контакт не будет показан на сайте"
      - name: subscribeNote
        label: Текст кнопки «написать»
        type: string
      - name: socials
        label: Соцсети
        type: object
        list: true
        fields:
          - name: label
            label: Название
            type: string
          - name: url
            label: Ссылка
            type: string
            pattern:
              regex: "^(https://.*)?$"
              message: "Ссылка должна начинаться с https:// либо остаться пустой"
      - name: featured
        label: Избранное на главной
        type: string
        list: true
        description: "Названия работ (как имена файлов) в нужном порядке. Первая станет картинкой-превью при отправке ссылки."

  # ---------- Работы ----------
  - name: works_gobelen
    label: Работы — Гобелен
    type: collection
    path: content/works/Гобелен
    extension: md
    filename: "{fields.title}.md"
    icon: image
    view:
      fields: [title, size, year]
      primary: title
    fields:
      - name: title
        label: Название работы
        type: string
        required: true
        description: "Так работа подписана на сайте. Оно же станет именем карточки."
      - name: images
        label: Изображения
        type: image
        list: true
        required: true
        options:
          media: gobelen
        description: "Одна картинка — обычная работа. Несколько — серия: их можно перетаскивать, порядок на сайте будет такой же. Размер подгоняется сам, при открытии во весь экран показывается оригинал."
      - name: materials
        label: Материалы
        type: select
        options:
          multiple: true
          creatable: true
          values: [Шерсть, Вискоза, Ручное ткачество, Текстиль, Текстильные материалы, Бумага, Медь, Гор. эмаль, Стекло]
        description: "Выберите из списка. Если нужного нет — впишите своё, оно появится в списке в следующий раз."
      - name: size
        label: Размер
        type: string
        description: "Например: 100х150 см. Если у частей серии размеры разные — перечислите через запятую."
      - name: year
        label: Год
        type: string
      - name: layout
        label: Расположение частей серии
        type: select
        options:
          values:
            - { value: "авто", label: "Автоматически — сайт решит сам" }
            - { value: "ряд", label: "В ряд  ▭ ▭ ▭" }
            - { value: "квадрат", label: "Квадратом  ▭ ▭ / ▭ ▭" }
        description: "Нужно только для серии из нескольких картинок. «Автоматически»: до трёх частей — в ряд, вытянутые вверх — в ряд, остальные — квадратом."
      - name: order
        label: Номер в категории
        type: number
        description: "Необязательно. Работы с номером встают в начало категории по возрастанию, остальные — как обычно, по алфавиту."

  - name: works_collage
    label: Работы — Коллаж
    type: collection
    path: content/works/Коллаж
    extension: md
    filename: "{fields.title}.md"
    icon: image
    view:
      fields: [title, size, year]
      primary: title
    fields:
      - name: title
        label: Название работы
        type: string
