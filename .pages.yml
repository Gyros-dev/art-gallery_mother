  # ---------- Публикации ----------
  - name: texts
    label: Публикации и статьи
    type: collection
    path: content/texts
    extension: md
    format: raw
    icon: book-open
    fields:
      - name: body
        label: Текст
        type: text
        description: "Первая строка — заголовок публикации, дальше сам текст."
