# Настройка панели управления сайтом (Pages CMS).
# Открывается на app.pagescms.org — вход через GitHub, приглашение по email.
# Этот файл правится редко: обычно только когда появляется новая категория работ.

media:
  - name: gobelen
    label: Картинки — Гобелен
    input: images/art/Гобелен
    output: /images/art/Гобелен
    categories: [image]
  - name: collage
    label: Картинки — Коллаж
    input: images/art/Коллаж
    output: /images/art/Коллаж
    categories: [image]
  - name: object
    label: Картинки — Арт-объект
    input: images/art/Арт-объект
    output: /images/art/Арт-объект
    categories: [image]
  - name: exhibition_photos
    label: Фотографии с выставок
    input: images/exhibitions
    output: /images/exhibitions
    categories: [image]
  - name: portrait
    label: Фотографии художника
    input: images/other
    output: /images/other
    categories: [image]

content:
  # ---------- Работы ----------
  - name: works_gobelen
    label: Работы — Гобелен
    description: >-
      Здесь живут все работы категории «Гобелен». Одна карточка = одна работа
      на сайте. Чтобы добавить новую, нажмите кнопку «+» вверху справа.
      Чтобы изменить существующую — просто щёлкните по ней в списке.
      Чтобы убрать работу с сайта — откройте её и выберите «Delete» («Удалить»)
      в меню с тремя точками вверху справа; после этого зайдите в Media →
      «Картинки — Гобелен» и удалите там саму картинку, иначе работа вернётся
      на сайт без описания.
      После нажатия «Save» («Сохранить») сайт обновится сам за 1–2 минуты —
      просто откройте https://annaveksler.ru и посмотрите результат.
    type: collection
    path: content/works/Гобелен
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    view:
      primary: title
      fields: [title, size, year]
    fields:
      - name: title
        label: Название работы
        type: string
        required: true
        description: >-
          Как работа будет подписана на сайте. Пишите обычными словами,
          например: Ангел для Маруси. Изменить название можно в любой момент —
          картинка при этом не потеряется.
      - name: images
        label: Изображения
        type: image
        required: true
        options:
          media: gobelen
          multiple: true
        description: >-
          Нажмите на поле — откроется окно выбора. Кнопка «Upload» («Загрузить»)
          позволяет добавить файл с компьютера, можно просто перетащить его
          мышкой в это окно. Загружайте самый большой и качественный файл,
          какой у вас есть (jpg, png или webp) — сайт сам сделает из него
          маленькую картинку для сетки, среднюю для галереи и сохранит оригинал,
          который открывается при развороте работы на весь экран. Уменьшать
          и обрезать заранее ничего не нужно.
          ОДНА картинка — обычная работа. НЕСКОЛЬКО картинок — серия (диптих,
          триптих и т. п.): они покажутся вместе как одна работа.
          Порядок картинок меняется перетаскиванием мышкой — как расставите,
          так и будет на сайте. Чтобы убрать лишнюю картинку, наведите на неё
          и нажмите крестик. Чтобы заменить картинку — уберите старую крестиком
          и добавьте новую.
      - name: materials
        label: Материалы
        type: select
        options:
          multiple: true
          values: [Шерсть, Вискоза, Ручное ткачество, Текстиль, Текстильные материалы, Бумага, Медь, Гор. эмаль, Стекло]
        description: >-
          Отметьте галочками всё, из чего сделана работа. Они встанут в подпись
          под работой через запятую, в том порядке, в каком вы их выберете.
          Нужного материала нет в списке? Не страшно — впишите его в следующее
          поле «Другие материалы».
      - name: materials_other
        label: Другие материалы
        type: string
        description: >-
          Заполняйте, только если нужного материала не нашлось в списке выше.
          Впишите его сюда обычным текстом; если материалов несколько —
          через запятую, например: лён, металлическая нить.
          Они добавятся в подпись после отмеченных галочками.
      - name: size
        label: Размер
        type: string
        description: >-
          Размер работы так, как вы обычно его пишете, например: 100х150 см.
          Если это серия и у частей размеры разные — перечислите все через
          запятую: 15х30 см, 25х25 см, 20х42 см.
          Можно оставить пустым — тогда размер просто не покажется.
      - name: year
        label: Год
        type: string
        description: >-
          Год создания работы, например: 2024. Можно оставить пустым.
      - name: layout
        label: Расположение частей серии
        type: select
        options:
          values:
            - { value: "авто", label: "Автоматически — сайт решит сам" }
            - { value: "ряд", label: "В ряд:  ▭ ▭ ▭" }
            - { value: "квадрат", label: "Квадратом:  ▭ ▭ / ▭ ▭" }
        description: >-
          Нужно только если в работе несколько картинок. Определяет, как части
          серии встанут рядом друг с другом на странице.
          «Автоматически» подходит почти всегда: до трёх частей и вытянутые
          вверх работы сайт ставит в ряд, а остальные — квадратом.
          Для одиночной работы это поле никак не влияет, его можно не трогать.
      - name: order
        label: Номер в категории
        type: number
        description: >-
          Обычно это поле НЕ нужно — оставьте пустым, и работы выстроятся
          по алфавиту. Заполняйте, только если хотите вынести конкретные работы
          в начало категории: поставьте 1 у той, что должна быть первой, 2 —
          у второй и так далее. Все работы без номера останутся после них,
          в обычном порядке.

