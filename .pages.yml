  # ---------- Выставки ----------
  - name: exhibitions
    label: Выставки
    description: >-
      Список всех выставок. Нажмите «+», чтобы добавить новую.
      Сайт сам разберётся, прошла выставка, идёт прямо сейчас или ещё только
      будет — по датам, которые вы впишете. Ничего переключать вручную не надо:
      идущие и будущие показываются вверху страницы, прошедшие уезжают в «Архив».
    type: file
    path: data/exhibitions.json
    format: json
    list: true
    fields:
      - name: title
        label: Название выставки
        type: string
        required: true
        description: "Так, как выставка называется в афише."
      - name: date
        label: Даты
        type: string
        required: true
        description: >-
          Пишите привычно, словами: 07 августа — 18 октября 2026.
          Если точные числа неизвестны, достаточно одного года: 2024.
          По этой строке сайт и определяет, прошла выставка или ещё идёт,
          поэтому год указывать обязательно.
      - name: location
        label: Место
        type: string
        description: "Зал, улица, город. Например: Манеж, Исаакиевская пл. 1, Санкт-Петербург."
      - name: description
        label: Описание
        type: text
        description: >-
          Необязательно. Короткое пояснение в одну-две строки,
          например: Совместно с И. Дьяковым. Оставите пустым — строки просто не будет.
      - name: url
        label: Сайт выставки
        type: string
        pattern:
          regex: "^(https://.*)?$"
          message: "Ссылка должна начинаться с https:// либо остаться пустой"
        description: >-
          Необязательно. Адрес страницы выставки целиком, вместе с https://.
          На сайте появится кнопка «Сайт выставки».
      - name: photos
        label: Папка с фотографиями
        type: string
        description: >-
          Необязательно. Сначала зайдите в Media → «Фотографии с выставок»,
          создайте там папку и загрузите в неё снимки. Потом впишите сюда
          название этой папки — точно так же, как назвали её, буква в букву.
          На странице выставки появятся миниатюры и кнопка «Фотографии».
          Нет фотографий — оставьте пустым.

  # ---------- Настройки сайта ----------
  - name: settings
    label: Настройки сайта
    description: >-
      Общие настройки: как сайт называется, фотография художника, контакты
      и какие работы показывать на главной. Меняется редко.
    type: file
    path: data/site.json
    format: json
    fields:
      - name: title
        label: Название сайта
        type: string
        required: true
        description: "Видно во вкладке браузера и когда вы отправляете ссылку на сайт в мессенджере."
      - name: shortTitle
        label: Короткое имя
        type: string
        description: "Короткий вариант названия для узких мест, например просто: Анна Векслер."
      - name: tagline
        label: Подзаголовок
        type: string
        description: "Одна строка под названием, например: Гобелен · коллаж · текстильное искусство."
      - name: description
        label: Описание для поисковиков
        type: text
        description: >-
          Две-три строки о сайте. Именно этот текст люди видят в Яндексе
          и Google под ссылкой на сайт.
      - name: url
        label: Адрес сайта
        type: string
        description: >-
          Адрес, по которому сайт открывается: https://annaveksler.ru
          Менять нужно только если когда-нибудь смените домен.
      - name: name
        label: Имя художника
        type: string
      - name: location
        label: Город
        type: string
      - name: photo
        label: Фотография художника
        type: image
        options:
          media: portrait
        description: >-
          Снимок на странице «Художник». Нажмите на поле, затем «Upload»
          («Загрузить»), и выберите файл с компьютера — можно просто перетащить
          его мышкой. Подойдёт фотография ЛЮБОГО размера и формата: сайт сам
          впишет её в рамку и ничего не сломается. Лучше всего смотрится
          вертикальный или квадратный снимок; широкий будет подрезан по бокам.
      - name: email
        label: Электронная почта
        type: string
        description: "Оставьте пустым — и почта просто не будет показана на сайте."
      - name: phone
        label: Телефон
        type: string
        description: "Оставьте пустым — и телефон просто не будет показан на сайте."
      - name: subscribeNote
        label: Текст кнопки «написать»
        type: string
        description: "Надпись на кнопке письма художнику. Работает, только если заполнена почта."
      - name: socials
        label: Соцсети
        type: object
        list: true
        description: >-
          Ссылки на страницы в соцсетях. Если ссылка пустая — кнопки на сайте
          не будет, строку можно не удалять.
        fields:
          - name: label
            label: Название
            type: string
            description: "ВКонтакте, Telegram, WhatsApp — название определяет, какой значок покажется."
          - name: url
            label: Ссылка
            type: string
            pattern:
              regex: "^(https://.*)?$"
              message: "Ссылка должна начинаться с https:// либо остаться пустой"
            description: "Адрес страницы целиком, вместе с https://. Пусто — кнопки не будет."
      - name: featured
        label: Избранное на главной
        type: string
        list: true
        description: >-
          Названия работ, которые крутятся в карусели на главной странице,
          в нужном вам порядке (перетаскивайте мышкой, чтобы поменять местами).
          Пишите название ровно так, как оно записано в карточке работы.
          ВАЖНО: первая работа из этого списка становится картинкой-превью —
          её видят люди, когда вы отправляете ссылку на сайт в мессенджере.
          Оставите список пустым — сайт покажет 6 случайных работ.

  # ---------- Публикации ----------
  - name: texts
    label: Публикации и статьи
    description: >-
      Статьи и эссе для раздела «Литература». Нажмите «+», чтобы добавить новую.
      ПЕРВАЯ СТРОКА текста — это заголовок статьи, дальше с новой строки
      идёт сам текст.
    type: collection
    path: content/texts
    format: raw
    filename: "{year}-{month}-{day}-{hour}{minute}.md"
    fields:
      - name: body
        label: Текст
        type: text
        description: >-
          Первая строка — заголовок, который увидят в списке публикаций.
          Дальше, с новой строки, сам текст. Между абзацами оставляйте
          пустую строку.
