<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выставки — Анна Векслер</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="256x256" href="../assets/favicon-256.png">
  <link rel="apple-touch-icon" href="../assets/favicon-180.png">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/exhibitions.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="page">
    <div class="section-head reveal">
      <span class="section-num">02</span>
      <h1>Выставки</h1>
      <p class="section-sub">Экспозиции и участие</p>
    </div>

    <section class="exh-group" id="upcoming-group" hidden>
      <h2>Текущие и будущие</h2>
      <div class="timeline" id="upcoming-exhibitions"></div>
    </section>

    <p class="exh-empty" id="exh-empty" hidden>Пока нет выставок для показа.</p>

    <section class="exh-group" id="archive-group" hidden>
      <button class="archive-toggle" id="archive-toggle" aria-expanded="false">
        <span>Архив</span>
        <span class="archive-count" id="archive-count"></span>
        <span class="archive-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="timeline collapsed" id="past-exhibitions"></div>
    </section>
  </main>

  <div id="preview-overlay">
    <div id="preview-close">×</div>
    <!-- sandbox: чужой сайт во фрейме не может перехватить нашу страницу
         (нет allow-top-navigation) и работает в своей песочнице -->
    <iframe id="preview-frame" src="" title="Предпросмотр выставки"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
            referrerpolicy="no-referrer" loading="lazy"></iframe>
  </div>

  <footer class="site-footer">
    <p class="footer-name">Анна Векслер</p>
    <div class="footer-links">
      <a href="gallery.html">Галерея</a>
      <a href="exhibitions.html">Выставки</a>
      <a href="literature.html">Литература</a>
      <a href="about.html">Художник</a>
    </div>
    <p class="footer-note">© <span data-year></span> · Санкт-Петербург</p>
  </footer>

  <script src="../js/common.js"></script>
  <script src="../js/exhibitions.js"></script>
</body>
</html>
