name: Сборка и публикация на GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установить зависимости (sharp)
        run: npm install --no-audit --no-fund
      - name: Оптимизировать картинки (WebP ≤2000px + эскизы)
        run: node scripts/optimize-images.mjs
      - name: Собрать каталог из папок (галерея, тексты, фото выставок)
        run: node scripts/build-gallery.mjs
      - name: Убрать node_modules из публикации
        run: rm -rf node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Публикация Pages иногда падает с временной ошибкой GitHub
      # («Deployment failed, try again later») — делаем автоповтор.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Пауза перед повтором
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Повторная публикация
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
